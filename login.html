<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>Welcome back</h1>
            <p class="subtitle">Glad to see you again <br>Login to your account below</p>

            <form>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" placeholder="E-mail" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="Password" required>
                </div>

                <button type="submit" class="btn-login" onclick="location='index.html'">Login</button>
            </form>

            <p class="footer-text">Don't have an account? <a href="signup.html">Sign up for Free</a></p>
        </div>
    </div>
</body>
</html>
